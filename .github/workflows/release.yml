name: Release Mod

on:
  push:
    tags:
      - "v*"

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'gradle'

      # Gradle downloads the Java 17 and 25 toolchains through the Foojay resolver.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release artifacts
        run: ./gradlew build

      - name: Collect release artifacts
        run: |
          mkdir -p release
          find forge-1.20.1/forge/mc-1-20-1/build/libs neoforge-1.21.1/build/libs neoforge-26.1.2/build/libs \
            -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -exec cp {} release/ \;

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: release/*.jar

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: mod-jars
          path: release

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*.jar
