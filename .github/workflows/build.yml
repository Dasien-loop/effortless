name: Java CI with Gradle

on:
  pull_request:
    branches: ['**']
  push:
    branches: ['master']

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'gradle'

      # Gradle downloads the Java 17 and 25 toolchains through the Foojay resolver.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build
