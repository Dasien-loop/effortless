plugins {
    id 'java-library'
    id 'idea'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

allprojects {
    apply plugin: 'idea'
    idea {
        module {
            downloadJavadoc = true
            downloadSources = true
            excludeDirs.addAll([
                file('.gradle'),
                file('build'),
                file('out'),
                file('run'),
            ])
        }
    }
}

idea {
    project {
        jdkName = '17'
        languageLevel = '17'
    }
}
repositories {
    mavenCentral()
    mavenLocal()
    flatDir {
        dirs "libs"
    }
}

ext.supportedTargets = [
    [minecraft: '1.20.1', loader: 'forge',    universalApi: 'local-api',    loaderVersion: '47.2.20', status: 'verified'],
    [minecraft: '1.21.1', loader: 'neoforge', universalApi: 'local-api',    loaderVersion: '21.1.230', status: 'verified'],
    [minecraft: '26.1.2', loader: 'neoforge', universalApi: 'local-api',    loaderVersion: '26.1.2.95', status: 'verified'],
]

dependencies {
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    annotationProcessor 'com.google.auto.service:auto-service:1.1.1'
    compileOnly 'com.google.auto.service:auto-service:1.1.1'

    compileOnly 'io.netty:netty-all:4.1.109.Final'
    compileOnly 'org.slf4j:slf4j-api:2.0.13'

    implementation project(':local-api')
    implementation 'com.electronwill.night-config:core:3.6.7'
    implementation 'com.electronwill.night-config:toml:3.6.7'
    implementation 'com.electronwill.night-config:json:3.6.7'
}

tasks.register('printSupportedTargets') {
    group = 'help'
    description = 'Print the intended Minecraft/loader target matrix.'
    doLast {
        supportedTargets.each { target ->
            println "${target.minecraft} ${target.loader} ${target.loaderVersion} - ${target.status}"
        }
    }
}
